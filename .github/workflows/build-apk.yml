name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TaskFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: android/app/build/outputs/apk/debug/TaskFlow.apk

  release:
    name: Create Release with APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TaskFlow-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TaskFlow.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.ref_name }}

            ### Installation
            1. Download `TaskFlow.apk` below
            2. Open the APK file on your Android device
            3. Allow "Install from unknown sources" if prompted
            4. Tap **Install**

            ### What's New
            See the auto-generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
