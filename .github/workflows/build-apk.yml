name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "Installed SDK platforms:"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "Installed build-tools:"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../gradle_build.log; then
            echo "::group::Full Gradle Log"
            cat ../gradle_build.log
            echo "::endgroup::"
            ERR=$(grep -E -A 5 "\* What went wrong:|\* Exception is:" ../gradle_build.log | tr '\r\n' ' ' | head -c 500)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 20 ../gradle_build.log | tr '\r\n' ' ' | head -c 500)
            fi
            echo "::error title=Gradle Error::$ERR"
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Prepare APK artifact
        run: |
          echo "Locating built APK..."
          find android/app/build/ -name "*.apk" -ls
          APK_PATH=$(find android/app/build/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in android/app/build/"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p build-output
          cp "$APK_PATH" build-output/TaskFlow.apk
          ls -la build-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: build-output/TaskFlow.apk

  release:
    name: Create Release with APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TaskFlow-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TaskFlow.apk
          generate_release_notes: true
          body: |
            ## TaskFlow ${{ github.ref_name }}

            ### Installation
            1. Download `TaskFlow.apk` below
            2. Open the APK file on your Android device
            3. Allow "Install from unknown sources" if prompted
            4. Tap **Install**

            ### What's New
            See the auto-generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
